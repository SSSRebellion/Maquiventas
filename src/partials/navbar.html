<!-- Navigation Header Estilo GECOLSA CAT (Solo texto corporativo limpio) -->
<div class="industrial-ribbon"></div>
<header class="navbar cat-navbar">
    <div class="cat-nav-top-row">
        <!-- Logo Oficial CAT / GECOLSA -->
        <a href="index.html" class="cat-brand-wrapper" title="Maqui Ventas - Distribuidor Autorizado CAT">
            <div class="cat-brand-dealer">MAQUI VENTAS</div>
            <div class="cat-brand-emblem">CAT<span class="cat-triangle">▲</span></div>
        </a>

        <!-- Barra de Búsqueda Estilo CAT Dual: [ Agregar equipo ] [ Input ] [ Buscar ] -->
        <div class="cat-search-dual-bar">
            <button type="button" class="cat-search-addon-btn" onclick="if(window.location.pathname.indexOf('catalogo')===-1 && typeof scrollToCatalog==='function'){ scrollToCatalog(); } else { window.location.href='catalogo.html'; }">
                <span>Agregar equipo</span>
                <span style="font-size: 0.65rem; margin-left: 4px;">▼</span>
            </button>
            <input type="text" id="top-cat-search" class="cat-search-field" placeholder="Buscar por número o nombre de maquinaria..." oninput="syncCatalogSearch(this.value)">
            <button type="button" class="cat-search-btn-submit" onclick="if(window.location.pathname.indexOf('catalogo')===-1 && typeof scrollToCatalog==='function'){ scrollToCatalog(); } else { window.location.href='catalogo.html'; }" title="Buscar maquinaria">
                Buscar
            </button>
        </div>

        <!-- Enlaces de Cabecera Derecha -->
        <div class="cat-nav-right">
            <div class="cat-nav-meta-item">
                <div style="font-size: 0.75rem; line-height: 1.2;">
                    <div style="font-weight: 700; color: #fff;">Sede Central Bogotá</div>
                    <div style="color: #94a3b8;">Distribuidor Autorizado</div>
                </div>
            </div>

            <!-- Accesos a Páginas Independientes -->
            <a href="catalogo.html" class="cat-nav-link-btn" title="Ir al Catálogo de Maquinaria">
                <span>Catálogo</span>
            </a>
            <a href="cotizador.html" class="cat-nav-link-btn" title="Simulador de Leasing & Cotizaciones">
                <span>Financiamiento</span>
            </a>
            <a href="javascript:void(0)" class="cat-nav-link-btn" onclick="openHelpCenter()" title="Centro de Ayuda y Soporte">
                <span>Centro de ayuda</span>
            </a>

            <!-- Controles de Carrito e Historial para Clientes -->
            <div id="client-nav-actions" class="hidden" style="display: flex; align-items: center; gap: 8px;">
                <button class="cat-nav-link-btn" onclick="openOrderHistoryModal()" title="Historial de pedidos">
                    <span>Historial</span>
                </button>
                <button class="cart-nav-btn cat-cart-btn" onclick="openCart()" title="Ver carrito de compras">
                    <span>Carrito</span>
                    <span id="cart-badge" class="cart-count-badge" style="display: none;">0</span>
                </button>
            </div>

            <!-- Perfil de Usuario Logueado -->
            <div id="user-nav" class="user-nav-profile hidden">
                <div class="user-pill cat-user-pill">
                    <span id="nav-user-name" style="font-weight: 700;">Usuario</span>
                    <span id="nav-user-role" class="role-badge client">Cliente</span>
                </div>
                <button class="btn btn-outline btn-sm cat-logout-btn" onclick="logout()" title="Cerrar sesión">
                    <span>Salir</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Sub-barra de Navegación CAT -->
    <div class="cat-nav-sub-row">
        <div class="cat-sub-left">
            <span class="cat-sub-item active" onclick="filterByCategory('all')">Categorías <small>▼</small></span>
            <span class="cat-sub-item" onclick="filterByCategory('Movimiento de Tierras')">Movimiento de Tierras</span>
            <span class="cat-sub-item" onclick="filterByCategory('Agrícola')">Agrícola</span>
            <span class="cat-sub-item" onclick="filterByCategory('Carga y Logística')">Carga & Bodega</span>
            <span class="cat-sub-item" onclick="filterByCategory('Pavimentación y Vías')">Pavimentación</span>
        </div>
        <div class="cat-sub-right">
            <a href="catalogo.html" class="cat-sub-link">Lista de Equipos</a>
            <a href="cotizador.html" class="cat-sub-link">Cotizador Formal</a>
            <span class="cat-sub-link" onclick="openOrderHistoryModal()">Historial de pedidos</span>
            <span class="cat-sub-link" onclick="openHelpCenter()">Centro de ayuda</span>
        </div>
    </div>
</header>
